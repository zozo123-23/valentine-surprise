<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une surprise pour toi 🎂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Playfair+Display:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-anniv">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <main class="card">
        <div class="big-emoji" aria-hidden="true">✉️</div>
        <h1>Une petite attention pour toi</h1>
        <p class="sub">Elle est juste là, à ouvrir.</p>
        <div class="buttons">
            <button id="openBtn" class="btn-yes">Ouvrir</button>
        </div>
    </main>

    <script>
        window.PAGE = {
            floaters: ['✨', '🥂', '✨', '🤍'],
            rain: ['✨', '🥂', '🌟', '✨'],
            yes: {
                emoji: '🥂',
                title: 'Joyeux anniversaire !',
                text: 'Que cette nouvelle année t’apporte tout ce que tu mérites ✨'
            }
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
