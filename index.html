<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une petite question… 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Playfair+Display:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-valentine">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <main class="card">
        <img class="hero" src="img/question.gif" alt="">
        <h1>Veux-tu être ma Valentine ?</h1>
        <p class="sub">Il n’y a qu’une seule bonne réponse 😉</p>
        <div class="buttons">
            <button id="yesBtn" class="btn-yes">Oui 💖</button>
            <button id="noBtn" class="btn-no">Non</button>
        </div>
    </main>

    <script>
        window.PAGE = {
            floaters: ['💗', '💕', '🌹', '💖'],
            rain: ['❤️', '💖', '🌹', '💘'],
            noLabels: ['Hmm, non ?', 'Réfléchis bien 🥺', 'Vraiment sûr ?', 'Allez, un effort…', 'Pitié 🥹', 'Tu me brises le cœur 💔'],
            notify: 'Réponse : OUI ❤️',
            yes: {
                img: 'img/oui.gif',
                title: 'Je savais que tu dirais oui !',
                text: 'Rendez-vous le 14 février 🌹'
            }
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
