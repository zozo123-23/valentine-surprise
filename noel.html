<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une petite question… 🎄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Playfair+Display:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-noel">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <main class="card">
        <div class="big-emoji" aria-hidden="true">🎄</div>
        <h1>Veux-tu passer Noël avec moi ?</h1>
        <p class="sub">Je promets du chocolat chaud et des cadeaux 🎁</p>
        <div class="buttons">
            <button id="yesBtn" class="btn-yes">Oui 💖</button>
            <button id="noBtn" class="btn-no">Non</button>
        </div>
    </main>

    <script>
        window.PAGE = {
            floaters: ['❄️', '⭐', '❄️', '✨'],
            rain: ['❄️', '🎁', '⭐', '🎄'],
            noLabels: ['Hmm, non ?', 'Réfléchis bien 🥺', 'Même pour du chocolat chaud ?', 'Allez, un effort…', 'Pitié 🥹', 'Même le sapin est triste 🎄'],
            notify: 'Réponse Noël : OUI 🎄',
            yes: {
                emoji: '🎁',
                title: 'Joyeux Noël !',
                text: 'On se retrouve le 25 décembre ⛄'
            }
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
